[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
entroximer-core = { path = "crates/entroximer-core" }

axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.12.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
fundsp = "0.23.0"
futures-util = "0.3.32"
hound = "3.5.1"
kanal = "0.1.1"
# matches songbird's opus2, so libopus is only linked once
opus2 = "0.4.0"
# the version songbird builds, so only one HTTP client and TLS stack is compiled
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
# matches songbird's rubato
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the driver only: the bot keeps its own Discord gateway connection
songbird = { version = "0.6.0", default-features = false, features = ["driver", "rustls", "tungstenite"] }
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# optimize dependencies in debug mode, but not our code, maintaining quicker debug warm build times
[profile.dev.package."*"]
opt-level = 2

# lightly optimize our code even in debug mode, nearly matching release mode performance
[profile.dev]
opt-level = 1

# production builds (the container image, the Nix package): slower to build, faster to run
[profile.release]
lto = "thin"
codegen-units = 1
