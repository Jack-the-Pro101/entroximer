[package]
name = "entroximer-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.0"
fundsp = "0.23.0"
futures-util = "0.3.32"
hound = "3.5.1"
kanal = "0.1.1"
reqwest = { version = "0.13.4", features = ["stream"] }
songbird = "0.6.0"
symphonia = { version = "0.6.0", features = ["all-codecs", "all-formats"] }
tokio = { version = "1.52.3", features = ["full"] }

# optimize dependencies in debug mode, but not our code, maintaining quicker debug warm build times
[profile.dev.package."*"]
opt-level = 2

# lightly optimize our code even in debug mode, nearly matching release mode performance
[profile.dev]
opt-level = 1
