# Development stack: `podman compose up --build` or `docker compose up --build`.
services:
  engine:
    build:
      context: ./engine
      dockerfile: Containerfile
    image: localhost/entroximer-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:2333:2333"
    environment:
      # what clients must send as `Authorization`, e.g. from `ENTROXIMER_PASSWORD=...` in a .env
      # file; unset, any client that can reach the port may use the engine
      ENTROXIMER_PASSWORD: ${ENTROXIMER_PASSWORD:-}
      RUST_LOG: info,songbird=warn
      # yt-dlp is installed and updated by the engine; these tune it:
      # ENTROXIMER_YTDLP_NIGHTLY: "true"            # YouTube fixes arrive in nightly builds first
      # ENTROXIMER_YTDLP_PACKAGE: "yt-dlp[default,curl-cffi]==2026.10.26"   # pin a version
      # ENTROXIMER_YTDLP_UPDATE_HOURS: "24"         # 0 = install once, never update
      # Spotify links and `spsearch:` (played from YouTube), with a Spotify app's credentials:
      # ENTROXIMER_SPOTIFY_CLIENT_ID: ${ENTROXIMER_SPOTIFY_CLIENT_ID:-}
      # ENTROXIMER_SPOTIFY_CLIENT_SECRET: ${ENTROXIMER_SPOTIFY_CLIENT_SECRET:-}
      # YouTube session for age-restricted videos; or run `entroximer youtube cookies import -`
      # ENTROXIMER_YOUTUBE_COOKIES_FILE: /run/secrets/youtube-cookies
      # A bot's own sounds, played by their path: mount the same directory at the same path into
      # the bot's container too (see the volume below)
      # ENTROXIMER_LOCAL_FILES_DIR: /sounds
    # secrets:
    #   - youtube-cookies
    volumes:
      # the engine-managed yt-dlp and YouTube session; persist across restarts and image upgrades
      - engine-data:/var/lib/entroximer
      # The packet cache spills here instead of RAM. Named volumes live in the container
      # engine's storage; to place it elsewhere use a bind mount, e.g. `/mnt/ssd/cache:/var/cache/entroximer:Z`
      # (`:Z` relabels it for SELinux hosts such as Fedora).
      - engine-cache:/var/cache/entroximer
      # - ./sounds:/sounds:ro,Z
    healthcheck:
      test: ["CMD", "entroximer", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  engine-data:
  engine-cache:

